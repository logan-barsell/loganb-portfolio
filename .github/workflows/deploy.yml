name: Build & Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Prepare production env file
      env:
        RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        RESEND_FROM: ${{ secrets.RESEND_FROM }}
        INQUIRY_NOTIFY_TO: ${{ secrets.INQUIRY_NOTIFY_TO }}
        EMAIL_LOGO_URL: ${{ secrets.EMAIL_LOGO_URL }}
        ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
        ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        CLIENT_SESSION_SECRET: ${{ secrets.CLIENT_SESSION_SECRET }}
        STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        STRIPE_HOSTING_PRICE_ID_39: ${{ secrets.STRIPE_HOSTING_PRICE_ID_39 }}
        STRIPE_HOSTING_PRICE_ID_25: ${{ secrets.STRIPE_HOSTING_PRICE_ID_25 }}
        STRIPE_HOSTING_PRICE_ID_10: ${{ secrets.STRIPE_HOSTING_PRICE_ID_10 }}
      run: |
        set -euo pipefail

        require_env() {
          local name="$1"
          if [ -z "${!name:-}" ]; then
            echo "Missing required GitHub secret: $name" >&2
            exit 1
          fi
        }

        require_env RESEND_API_KEY
        require_env RESEND_FROM
        require_env INQUIRY_NOTIFY_TO
        require_env ADMIN_EMAIL
        require_env ADMIN_PASSWORD_HASH
        require_env ADMIN_SESSION_SECRET
        require_env CLIENT_SESSION_SECRET
        require_env STRIPE_SECRET_KEY
        require_env STRIPE_WEBHOOK_SECRET
        require_env STRIPE_HOSTING_PRICE_ID_39
        require_env STRIPE_HOSTING_PRICE_ID_25
        require_env STRIPE_HOSTING_PRICE_ID_10

        strip_quotes() {
          local v="$1"
          if [[ "$v" == \"*\" ]]; then
            v="${v:1:${#v}-2}"
          fi
          printf '%s' "$v"
        }

        RESEND_FROM="$(strip_quotes "$RESEND_FROM")"

        mkdir -p deploy-artifacts
        ENV_FILE="$GITHUB_WORKSPACE/deploy-artifacts/loganb-api.env"
        umask 077
        {
          printf '%s\n' 'NODE_ENV=production'
          printf '%s\n' 'HOST=127.0.0.1'
          printf '%s\n' 'PORT=3001'
          printf '%s\n' ''
          printf '%s\n' 'DATABASE_PATH=/var/lib/loganb-api/inquiries.sqlite'
          printf '%s\n' 'UPLOAD_PATH=/var/lib/loganb-api/uploads'
          printf '%s\n' ''
          printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY"
          printf 'RESEND_FROM="%s"\n' "${RESEND_FROM//\"/\\\"}"
          printf 'INQUIRY_NOTIFY_TO=%s\n' "$INQUIRY_NOTIFY_TO"
          printf '%s\n' ''
          if [ -n "${EMAIL_LOGO_URL:-}" ]; then
            printf 'EMAIL_LOGO_URL=%s\n' "$EMAIL_LOGO_URL"
          fi
          printf '%s\n' 'TRUST_PROXY=1'
          printf '%s\n' ''
          printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
          printf 'ADMIN_PASSWORD_HASH=%s\n' "$ADMIN_PASSWORD_HASH"
          printf 'ADMIN_SESSION_SECRET=%s\n' "$ADMIN_SESSION_SECRET"
          printf '%s\n' 'ADMIN_SESSION_TTL_SECONDS=43200'
          printf '%s\n' 'ADMIN_SESSION_COOKIE_NAME=lb_admin_session'
          printf '%s\n' 'ALLOWED_ORIGIN=https://loganbarsell.com'
          printf '%s\n' 'PUBLIC_APP_URL=https://loganbarsell.com'
          printf '%s\n' ''
          printf 'CLIENT_SESSION_SECRET=%s\n' "$CLIENT_SESSION_SECRET"
          printf '%s\n' 'CLIENT_SESSION_TTL_SECONDS=604800'
          printf '%s\n' 'CLIENT_SESSION_COOKIE_NAME=lb_client_session'
          printf '%s\n' 'CLIENT_PORTAL_SETUP_TTL_DAYS=7'
          printf '%s\n' ''
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_SECRET_KEY"
          printf 'STRIPE_WEBHOOK_SECRET=%s\n' "$STRIPE_WEBHOOK_SECRET"
          printf 'STRIPE_HOSTING_PRICE_ID_39=%s\n' "$STRIPE_HOSTING_PRICE_ID_39"
          printf 'STRIPE_HOSTING_PRICE_ID_25=%s\n' "$STRIPE_HOSTING_PRICE_ID_25"
          printf 'STRIPE_HOSTING_PRICE_ID_10=%s\n' "$STRIPE_HOSTING_PRICE_ID_10"
        } > "$ENV_FILE"
        chmod 600 "$ENV_FILE"

        grep -q '^RESEND_API_KEY=.' "$ENV_FILE"
        grep -q '^ADMIN_PASSWORD_HASH=.' "$ENV_FILE"
        grep -q '^STRIPE_SECRET_KEY=.' "$ENV_FILE"
        echo "Prepared env file ($(wc -c < "$ENV_FILE") bytes)"

    - name: Copy env and deploy
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        SSH_KEY: ${{ secrets.SSH_KEY }}
      run: |
        set -euo pipefail

        ENV_FILE="$GITHUB_WORKSPACE/deploy-artifacts/loganb-api.env"
        if [ ! -f "$ENV_FILE" ]; then
          echo "Missing prepared env file at $ENV_FILE" >&2
          exit 1
        fi

        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key

        SSH_OPTS=(
          -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o BatchMode=yes
          -o StrictHostKeyChecking=accept-new
        )

        echo "Copying env file..."
        scp "${SSH_OPTS[@]}" \
          "$ENV_FILE" \
          "${SSH_USERNAME}@${SSH_HOST}:/tmp/loganb-api.env"

        echo "Installing env and deploying app..."
        ssh "${SSH_OPTS[@]}" "${SSH_USERNAME}@${SSH_HOST}" bash -s <<'SCRIPT'
        set -euo pipefail

        if [ ! -f /tmp/loganb-api.env ]; then
          echo "Missing /tmp/loganb-api.env from scp step." >&2
          exit 1
        fi

        chmod 600 /tmp/loganb-api.env

        if ! grep -q '^RESEND_API_KEY=.' /tmp/loganb-api.env; then
          echo "Copied env file looks incomplete." >&2
          exit 1
        fi

        if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then
          sudo install -m 600 -o root -g root /tmp/loganb-api.env /etc/loganb-api.env
          sudo shred -u /tmp/loganb-api.env 2>/dev/null || sudo rm -f /tmp/loganb-api.env
        else
          install -m 600 -o root -g root /tmp/loganb-api.env /etc/loganb-api.env
          shred -u /tmp/loganb-api.env 2>/dev/null || rm -f /tmp/loganb-api.env
        fi

        echo "Env installed to /etc/loganb-api.env"

        cd /var/www/loganbarsell.com
        git pull
        npm ci
        npm run build
        cd server
        npm ci --omit=dev
        cd ..

        if systemctl cat loganb-api.service >/dev/null 2>&1; then
          systemctl restart loganb-api
          sleep 2
          curl -fsS http://127.0.0.1:3001/api/health >/dev/null
          echo "API health check passed"
        else
          echo "loganb-api.service not installed yet; skip API restart"
        fi

        nginx -t
        systemctl reload nginx
        echo "Deploy finished"
        SCRIPT
